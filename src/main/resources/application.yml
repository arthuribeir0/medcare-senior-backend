spring:
  application:
    name: medcare-senior
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:medcare_db}
    username: ${POSTGRES_USER:medcare_admin}
    password: ${POSTGRES_PASSWORD:medcare_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 8080