# Testes: cada contexto do Spring fica em cache durante toda a suíte com o próprio pool. Pools pequenos e sem
# conexões ociosas presas evitam esgotar o max_connections do PostgreSQL local (os testes de concorrência usam
# até 4 conexões ao mesmo tempo).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
