services:
  postgres:
    image: postgres:16-alpine
    container_name: medcare_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - medcare_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  medcare_pg_data: