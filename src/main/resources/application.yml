spring:
  application:
    name: medcare-senior
  autoconfigure:
    # Autenticacao somente via JWT: remove o usuario em memoria com senha gerada automaticamente.
    # No Spring Boot 4 a classe fica em org.springframework.boot.security.autoconfigure
    # (o pacote antigo ...boot.autoconfigure.security.servlet nao existe mais e seria ignorado).
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # Host e porta do banco: localhost:5432 no desenvolvimento; no conteiner de producao, o servico "postgres"
    # connectTimeout (s): abrir conexao com o banco inacessivel falha rapido em vez de esperar o TCP
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:medcare_db}?connectTimeout=5
    username: ${POSTGRES_USER:medcare_admin}
    password: ${POSTGRES_PASSWORD:medcare_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Banco fora do ar: pegar conexao do pool desiste em 5 s e a validacao em 3 s (a saude responde 503 em
      # segundos, em vez de prender a requisicao). Nao limita o tempo das consultas.
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    # Log de SQL desligado por padrão; para depurar, JPA_SHOW_SQL=true
    show-sql: ${JPA_SHOW_SQL:false}
    # Sem Open Session in View: a sessão do JPA termina na transação do use case (nada de lazy loading na view)
    open-in-view: false
    # O dialeto do PostgreSQL é detectado automaticamente pelo Hibernate 7
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 8080
jwt:
  # Chave HS256: minimo de 32 caracteres (256 bits). Em producao, defina via variavel de ambiente JWT_SECRET.
  secret: ${JWT_SECRET:medcare-senior-dev-secret-key-trocar-em-producao-123456}
  # Validade do token do CUIDADOR (padrao: 24 horas)
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Validade do token do IDOSO (padrao: 180 dias). Mais longa porque o pareamento usa codigo de uso unico
  # e o idoso nao deve precisar parear de novo com frequencia (RNF-02/RNF-06).
  expiration-idoso-ms: ${JWT_EXPIRATION_IDOSO_MS:15552000000}
app:
  # Fuso usado pelo Clock da aplicacao para "hoje" e "agora" (geracao de doses, remocao logica etc.)
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jobs:
    # Desligue (JOBS_ENABLED=false) para nao agendar nenhum job; os testes com contexto Spring desligam.
    enabled: ${JOBS_ENABLED:true}
    reabastecer-doses:
      # Cron do Spring (segundo minuto hora dia mes dia-da-semana), no fuso app.timezone. Padrao: 00:05 todo dia.
      cron: ${REABASTECER_DOSES_CRON:0 5 0 * * *}
    verificar-doses:
      # Varredura de doses: aviso ao cuidador no fim da tolerancia (dose segue PENDENTE) e encerramento como NAO_TOMADA
      # depois de encerramento-minutos. Padrao: segundo 0 de cada minuto.
      cron: ${VERIFICAR_DOSES_CRON:0 * * * * *}
    retentativa-avisos:
      # Reenvio dos avisos que falharam temporariamente (RN-010). Padrao: a cada 5 minutos, no segundo 30.
      cron: ${RETENTATIVA_AVISOS_CRON:30 */5 * * * *}
  alertas:
    # Tolerancia PADRAO (minutos apos o horario programado): no fim dela o cuidador e avisado (a dose continua PENDENTE
    # e aparece ATRASADA; confirmar depois disto da CONFIRMADA_COM_ATRASO). Vale quando o cuidador nao tem a sua.
    tolerancia-minutos: ${ALERTAS_TOLERANCIA_MINUTOS:30}
    # Janela de confirmacao de dose (calculada no servidor): abre N minutos ANTES do horario programado...
    antecedencia-confirmacao-minutos: ${ALERTAS_ANTECEDENCIA_CONFIRMACAO_MINUTOS:60}
    # ...e encerra N minutos DEPOIS dele (a dose vira NAO_TOMADA). Deve ser maior que a tolerancia (validado na subida).
    encerramento-minutos: ${ALERTAS_ENCERRAMENTO_MINUTOS:180}
    # Maximo de doses tratadas por fase (encerramento e aviso) em cada execucao da varredura; o resto fica para a proxima
    lote-maximo: ${ALERTAS_LOTE_MAXIMO:500}
    retentativa:
      # Tentativas de envio por aviso, contando a primeira (feita pela varredura). Esgotadas: evento FALHA.
      max-tentativas: ${ALERTAS_RETENTATIVA_MAX_TENTATIVAS:5}
      # Espera depois da 1a tentativa; dobra a cada nova (5 -> 5, 10, 20 e 40 minutos)
      intervalo-base-minutos: ${ALERTAS_RETENTATIVA_INTERVALO_BASE_MINUTOS:5}
      # Maximo de eventos reprocessados por execucao
      lote-maximo: ${ALERTAS_RETENTATIVA_LOTE_MAXIMO:200}
  fcm:
    # Push via Firebase Cloud Messaging. Desligado por padrao (e nos testes e no CI): os avisos so vao para o log.
    enabled: ${FCM_ENABLED:false}
    # Caminho do JSON da conta de servico do Firebase. NUNCA versione esse arquivo (bloqueado no .gitignore).
    # Com enabled=true e arquivo ausente, a aplicacao nao sobe.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    # true = o Firebase valida a mensagem (validateOnly) mas nao entrega ao aparelho; para testar credenciais e tokens
    dry-run: ${FCM_DRY_RUN:false}
  docs:
    # Swagger UI e /v3/api-docs. Desligado por padrao (fail closed); para ligar, defina DOCS_ENABLED=true.
    # Quando false, as rotas tambem continuam negadas no SecurityConfig.
    enabled: ${DOCS_ENABLED:false}
management:
  # Fail closed: nenhum endpoint do actuator, exceto a saude, so leitura e sem detalhes ({"status":"UP"} ou 503 se o
  # banco cair). Usada pelo HEALTHCHECK do conteiner; liberada sem token so em GET /actuator/health no SecurityConfig.
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      # Sem os grupos liveness/readiness (nao usados fora do Kubernetes): a resposta fica so com o status
      probes:
        enabled: false
springdoc:
  api-docs:
    enabled: ${app.docs.enabled}
  swagger-ui:
    enabled: ${app.docs.enabled}