spring:
  application:
    name: medcare-senior
  autoconfigure:
    # Autenticacao somente via JWT: remove o usuario em memoria com senha gerada automaticamente.
    # No Spring Boot 4 a classe fica em org.springframework.boot.security.autoconfigure
    # (o pacote antigo ...boot.autoconfigure.security.servlet nao existe mais e seria ignorado).
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:medcare_db}
    username: ${POSTGRES_USER:medcare_admin}
    password: ${POSTGRES_PASSWORD:medcare_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    # Log de SQL desligado por padrão; para depurar, JPA_SHOW_SQL=true
    show-sql: ${JPA_SHOW_SQL:false}
    # Sem Open Session in View: a sessão do JPA termina na transação do use case (nada de lazy loading na view)
    open-in-view: false
    # O dialeto do PostgreSQL é detectado automaticamente pelo Hibernate 7
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 8080
jwt:
  # Chave HS256: minimo de 32 caracteres (256 bits). Em producao, defina via variavel de ambiente JWT_SECRET.
  secret: ${JWT_SECRET:medcare-senior-dev-secret-key-trocar-em-producao-123456}
  # Validade do token do CUIDADOR (padrao: 24 horas)
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Validade do token do IDOSO (padrao: 180 dias). Mais longa porque o pareamento usa codigo de uso unico
  # e o idoso nao deve precisar parear de novo com frequencia (RNF-02/RNF-06).
  expiration-idoso-ms: ${JWT_EXPIRATION_IDOSO_MS:15552000000}
app:
  # Fuso usado pelo Clock da aplicacao para "hoje" e "agora" (geracao de doses, remocao logica etc.)
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jobs:
    # Desligue (JOBS_ENABLED=false) para nao agendar nenhum job; os testes com contexto Spring desligam.
    enabled: ${JOBS_ENABLED:true}
    reabastecer-doses:
      # Cron do Spring (segundo minuto hora dia mes dia-da-semana), no fuso app.timezone. Padrao: 00:05 todo dia.
      cron: ${REABASTECER_DOSES_CRON:0 5 0 * * *}
    verificar-doses:
      # Varredura de doses vencidas (PENDENTE -> NAO_TOMADA + aviso ao cuidador). Padrao: segundo 0 de cada minuto.
      cron: ${VERIFICAR_DOSES_CRON:0 * * * * *}
  alertas:
    # Minutos apos o horario programado em que a dose ainda pode ser confirmada antes de virar NAO_TOMADA
    # (tambem e o fim do "no prazo" da janela de confirmacao: depois disto a dose aparece ATRASADA)
    tolerancia-minutos: ${ALERTAS_TOLERANCIA_MINUTOS:30}
    # Janela de confirmacao de dose (calculada no servidor): abre N minutos ANTES do horario programado...
    antecedencia-confirmacao-minutos: ${ALERTAS_ANTECEDENCIA_CONFIRMACAO_MINUTOS:60}
    # ...e encerra N minutos DEPOIS dele. Deve ser maior que a tolerancia (validado na subida).
    encerramento-minutos: ${ALERTAS_ENCERRAMENTO_MINUTOS:180}
    # Dose que venceu ha mais que isto e marcada NAO_TOMADA, mas nao gera aviso (evita avisos muito atrasados)
    janela-notificacao-horas: ${ALERTAS_JANELA_NOTIFICACAO_HORAS:24}
    # Maximo de doses tratadas por execucao da varredura; o restante fica para a proxima
    lote-maximo: ${ALERTAS_LOTE_MAXIMO:500}
  fcm:
    # Push via Firebase Cloud Messaging. Desligado por padrao (e nos testes e no CI): os avisos so vao para o log.
    enabled: ${FCM_ENABLED:false}
    # Caminho do JSON da conta de servico do Firebase. NUNCA versione esse arquivo (bloqueado no .gitignore).
    # Com enabled=true e arquivo ausente, a aplicacao nao sobe.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    # true = o Firebase valida a mensagem (validateOnly) mas nao entrega ao aparelho; para testar credenciais e tokens
    dry-run: ${FCM_DRY_RUN:false}
  docs:
    # Swagger UI e /v3/api-docs. Desligado por padrao (fail closed); para ligar, defina DOCS_ENABLED=true.
    # Quando false, as rotas tambem continuam negadas no SecurityConfig.
    enabled: ${DOCS_ENABLED:false}
springdoc:
  api-docs:
    enabled: ${app.docs.enabled}
  swagger-ui:
    enabled: ${app.docs.enabled}